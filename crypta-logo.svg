<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Glow Blur -->
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>

    <!-- Glass Specular Filter -->
    <filter id="glass-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="alpha-blur"/>
      <feSpecularLighting in="alpha-blur" surfaceScale="3" specularConstant="1.2" specularExponent="20" lighting-color="#ffffff" result="spec">
        <fePointLight x="30" y="20" z="50"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="spec-out"/>
      <feComposite in="SourceGraphic" in2="spec-out" operator="over"/>
    </filter>

    <!-- Glow Radial Gradients -->
    <radialGradient id="glow-red" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff3b3b" stop-opacity="1" />
      <stop offset="50%" stop-color="#ff7b00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="65%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="1" />
      <stop offset="55%" stop-color="#3a7bd5" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3a7bd5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff007b" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#b100ff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#b100ff" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Surface Linear Gradient -->
    <linearGradient id="glass-surface" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18" />
    </linearGradient>

    <!-- Glass Rim Linear Gradient -->
    <linearGradient id="glass-rim" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
    </linearGradient>

    <!-- Inner Rim Gradient -->
    <linearGradient id="inner-rim" x1="85%" y1="85%" x2="20%" y2="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>

    <!-- Highlight Linear Gradient -->
    <linearGradient id="highlight-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Radiant Glow Orbs (Exact match to homepage glowing orbs) -->
  <g filter="url(#glow-blur)">
    <circle cx="36" cy="34" r="26" fill="url(#glow-red)" />
    <circle cx="66" cy="66" r="28" fill="url(#glow-cyan)" />
    <circle cx="50" cy="50" r="30" fill="url(#glow-purple)" />
  </g>

  <!-- Floating Glass Mini-Tile (Top Right) -->
  <rect x="73" y="19" width="11" height="11" rx="3.2" transform="rotate(22 78.5 24.5)" 
        fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.45)" stroke-width="0.9" />

  <!-- Floating Glass Mini-Tile (Bottom Left) -->
  <rect x="15" y="65" width="8.5" height="8.5" rx="2.5" transform="rotate(-18 19.25 69.25)" 
        fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.35)" stroke-width="0.8" />

  <!-- 3D Liquid/Glass Morphing Shape (Primary Body) -->
  <path d="M 50 18 
           C 68 17, 83 29, 82 48 
           C 81 67, 68 82, 49 82 
           C 31 82, 17 68, 18 49 
           C 19 30, 31 19, 50 18 Z" 
        fill="url(#glass-surface)" 
        stroke="url(#glass-rim)" 
        stroke-width="1.6" 
        filter="url(#glass-depth)" />

  <!-- Inner Refraction Layer -->
  <path d="M 50 23 
           C 64 22, 76 32, 75 48 
           C 74 63, 64 76, 49 76 
           C 35 76, 23 64, 24 49 
           C 25 33, 35 24, 50 23 Z" 
        fill="none" 
        stroke="url(#inner-rim)" 
        stroke-width="1" 
        opacity="0.85" />

  <!-- Top Glass Highlight / Glare Curve -->
  <path d="M 34 26 
           C 44 21, 58 21, 66 27 
           C 57 24, 43 24, 34 26 Z" 
        fill="url(#highlight-glare)" />

  <!-- Secondary Specular Micro Dot -->
  <circle cx="33" cy="33" r="2.2" fill="#ffffff" opacity="0.8" />
</svg>

